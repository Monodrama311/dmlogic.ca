<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大毛 — DM Logic</title>
<meta name="description" content="降维生存。不分析对方，只看你自己。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cpath d='M130 130 A30 30 0 0 1 70 130' fill='none' stroke='%23B8845A' stroke-width='4'/%3E%3Ccircle cx='100' cy='137' r='4' fill='%232C2825'/%3E%3Cline x1='100' y1='140' x2='100' y2='158' stroke='%232C2825' stroke-width='3'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F1EB;
  --ink: #2C2825;
  --ink-light: #6B6560;
  --ink-faint: #A8A09A;
  --signal: #B8845A;
  --signal-light: #D4A87A;
  --warm-white: #FAF8F5;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

::selection {
  background: var(--signal);
  color: var(--paper);
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: 'Noto Serif SC', 'DM Sans', Georgia, serif;
  background: var(--paper);
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════ */
/*  SECTION 1: THE ENTRANCE               */
/* ═══════════════════════════════════════ */

.entrance {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 60px 24px;
}

/* Subtle noise texture overlay */
.entrance::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.entrance > * { position: relative; z-index: 1; }

/* The logo — animated entrance */
.logo-mark {
  margin-bottom: 48px;
  opacity: 0;
  animation: breatheIn 2s ease-out 0.3s forwards;
}

.logo-mark svg {
  width: 120px;
  height: 120px;
}

/* Sun rays pulse gently */
.ray {
  animation: rayPulse 4s ease-in-out infinite;
}
.ray:nth-child(4) { animation-delay: 0.5s; }
.ray:nth-child(5) { animation-delay: 1s; }
.ray:nth-child(6) { animation-delay: 1.5s; }
.ray:nth-child(7) { animation-delay: 2s; }

@keyframes rayPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

@keyframes breatheIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Name treatment */
.name-block {
  text-align: center;
  margin-bottom: 40px;
  opacity: 0;
  animation: breatheIn 2s ease-out 0.8s forwards;
}

.name-zh {
  font-size: 2.4rem;
  font-weight: 300;
  letter-spacing: 0.3em;
  margin-bottom: 8px;
  color: var(--ink);
}

.name-en {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* The one-liner */
.tagline {
  max-width: 400px;
  text-align: center;
  font-size: 0.95rem;
  font-weight: 300;
  line-height: 2;
  color: var(--ink-light);
  margin-bottom: 56px;
  opacity: 0;
  animation: breatheIn 2s ease-out 1.3s forwards;
}

.tagline em {
  font-style: normal;
  color: var(--signal);
}

/* Social links — minimal */
.social-row {
  display: flex;
  gap: 32px;
  align-items: center;
  opacity: 0;
  animation: breatheIn 2s ease-out 1.8s forwards;
}

.social-link {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--ink-faint);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: color 0.4s ease;
}

.social-link:hover {
  color: var(--signal);
}

.social-link svg {
  width: 16px;
  height: 16px;
  opacity: 0.5;
  transition: opacity 0.4s ease;
}

.social-link:hover svg {
  opacity: 1;
}

/* Scroll hint */
.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: breatheIn 2s ease-out 2.5s forwards;
}

.scroll-hint span {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.scroll-line {
  width: 1px;
  height: 32px;
  background: var(--ink-faint);
  opacity: 0.3;
  animation: scrollPulse 2s ease-in-out infinite 3s;
}

@keyframes scrollPulse {
  0%, 100% { transform: scaleY(1); opacity: 0.3; }
  50% { transform: scaleY(1.5); opacity: 0.15; }
}

/* ═══════════════════════════════════════ */
/*  SECTION 2: THE IDENTITY                */
/* ═══════════════════════════════════════ */

.identity {
  padding: 120px 24px;
  max-width: 640px;
  margin: 0 auto;
}

.identity-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--signal);
  margin-bottom: 32px;
  opacity: 0.7;
}

.identity-text {
  font-size: 1.1rem;
  font-weight: 300;
  line-height: 2.2;
  color: var(--ink-light);
}

.identity-text strong {
  font-weight: 400;
  color: var(--ink);
}

.identity-text .aside {
  display: block;
  margin-top: 24px;
  font-size: 0.85rem;
  color: var(--ink-faint);
  font-style: italic;
}

/* ═══════════════════════════════════════ */
/*  SECTION 3: THE PROJECTS                */
/* ═══════════════════════════════════════ */

.projects {
  padding: 80px 24px 120px;
  max-width: 800px;
  margin: 0 auto;
}

.section-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--signal);
  margin-bottom: 48px;
  opacity: 0.7;
}

.project-grid {
  display: grid;
  gap: 1px;
  background: rgba(44, 40, 37, 0.06);
}

.project-card {
  background: var(--paper);
  padding: 40px 32px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  text-decoration: none;
  color: inherit;
  transition: background 0.5s ease;
  cursor: pointer;
}

.project-card:hover {
  background: var(--warm-white);
}

.project-info { flex: 1; }

.project-status {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--signal);
  margin-bottom: 12px;
}

.project-title {
  font-size: 1.3rem;
  font-weight: 400;
  margin-bottom: 8px;
}

.project-subtitle {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
}

.project-arrow {
  font-family: 'DM Sans', sans-serif;
  font-size: 1.2rem;
  color: var(--ink-faint);
  transition: color 0.4s ease, transform 0.4s ease;
  margin-top: 8px;
}

.project-card:hover .project-arrow {
  color: var(--signal);
  transform: translateX(4px);
}

/* ═══════════════════════════════════════ */
/*  FOOTER                                 */
/* ═══════════════════════════════════════ */

.footer {
  padding: 60px 24px;
  text-align: center;
  border-top: 1px solid rgba(44, 40, 37, 0.06);
}

.footer-logo svg {
  width: 40px;
  height: 40px;
  margin-bottom: 20px;
  opacity: 0.3;
}

.footer-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

/* ═══════════════════════════════════════ */
/*  RESPONSIVE                             */
/* ═══════════════════════════════════════ */

@media (max-width: 600px) {
  .name-zh { font-size: 1.8rem; }
  .tagline { font-size: 0.85rem; max-width: 300px; }
  .identity { padding: 80px 20px; }
  .identity-text { font-size: 1rem; }
  .project-card { padding: 28px 20px; flex-direction: column; }
  .project-arrow { align-self: flex-end; }
  .social-row { gap: 24px; }
}

/* ═══════════════════════════════════════ */
/*  SCROLL ANIMATIONS                      */
/* ═══════════════════════════════════════ */

.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════ -->
<!--  SECTION 1: THE ENTRANCE               -->
<!-- ═══════════════════════════════════════ -->

<section class="entrance">
  <div class="logo-mark">

<!-- ═══════════════════════════════════════ -->
<!--  SECTION 2: THE IDENTITY               -->
<!-- ═══════════════════════════════════════ -->

  <div class="project-grid reveal">

<!-- ═══════════════════════════════════════ -->
<!--  FOOTER                                -->
<!-- ═══════════════════════════════════════ -->

<footer class="footer">
  <div class="footer-logo">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M130 130 A30 30 0 0 1 70 130" fill="none" stroke="#2C2825" stroke-width="2.5" stroke-linecap="round"/>

</footer>

<!-- ═══════════════════════════════════════ -->
<!--  SCROLL REVEAL SCRIPT                  -->
<!-- ═══════════════════════════════════════ -->

<script>
(function() {
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.reveal').forEach(function(el) {
    observer.observe(el);
  });
})();
</script>

</body>
</html>
